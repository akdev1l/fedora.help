site_name: fedora.help
site_url: https://fedora.help
site_dir: build
repo_url: https://github.com/akdev1l/fedora.help
repo_name: akdev1l/fedora.help
edit_uri: edit/main/docs/
copyright: >-
  Content licensed
  <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - content.code.copy
    - navigation.indexes
    - content.action.edit
    - content.action.view

nav:
  - Home: index.md
  - Secure Boot: secure-boot.md
  - Third-Party Repositories:
      - repositories/index.md
      - RPM Fusion: repositories/rpmfusion.md
      - negativo17: repositories/negativo17.md
      - Terra: repositories/terra.md
      - Flathub: repositories/flathub.md
      - COPR: repositories/copr.md
  - NVIDIA Drivers:
      - nvidia/index.md
      - negativo17: nvidia/negativo17.md
  - Multimedia and Codecs:
      - multimedia/index.md
      - AMD: multimedia/amd.md
      - Intel: multimedia/intel.md
      - NVIDIA: multimedia/nvidia.md
      - Atomic Desktops: multimedia/atomic.md
  - Tooling:
      - tooling/index.md
      - fedoratricks: tooling/fedoratricks.md

plugins:
  - search
  - macros
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Secure Boot: 安全启动
            Third-Party Repositories: 第三方仓库
            NVIDIA Drivers: NVIDIA 驱动
            Multimedia and Codecs: 多媒体与编解码器
            Tooling: 工具
        - locale: hi
          name: हिन्दी
          build: true
          nav_translations:
            Home: मुख्य पृष्ठ
            Secure Boot: सुरक्षित बूट
            Third-Party Repositories: तृतीय-पक्ष रिपॉजिटरी
            NVIDIA Drivers: NVIDIA ड्राइवर
            Multimedia and Codecs: मल्टीमीडिया और कोडेक
            Tooling: उपकरण
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Secure Boot: Arranque Seguro
            Third-Party Repositories: Repositorios de Terceros
            NVIDIA Drivers: Controladores NVIDIA
            Multimedia and Codecs: Multimedia y Códecs
            Tooling: Herramientas
        - locale: ar
          name: العربية
          build: true
          nav_translations:
            Home: الرئيسية
            Secure Boot: الإقلاع الآمن
            Third-Party Repositories: مستودعات الطرف الثالث
            NVIDIA Drivers: تعريفات NVIDIA
            Multimedia and Codecs: الوسائط المتعددة والترميزات
            Tooling: الأدوات
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Secure Boot: Démarrage sécurisé
            Third-Party Repositories: Dépôts tiers
            NVIDIA Drivers: Pilotes NVIDIA
            Multimedia and Codecs: Multimédia et codecs
            Tooling: Outils
        - locale: bn
          name: বাংলা
          build: true
          nav_translations:
            Home: প্রথম পাতা
            Secure Boot: সিকিউর বুট
            Third-Party Repositories: তৃতীয় পক্ষের রিপোজিটরি
            NVIDIA Drivers: NVIDIA ড্রাইভার
            Multimedia and Codecs: মাল্টিমিডিয়া ও কোডেক
            Tooling: সরঞ্জাম
        - locale: pt
          name: Português
          build: true
          nav_translations:
            Home: Início
            Secure Boot: Inicialização Segura
            Third-Party Repositories: Repositórios de Terceiros
            NVIDIA Drivers: Drivers NVIDIA
            Multimedia and Codecs: Multimídia e Codecs
            Tooling: Ferramentas
        - locale: ru
          name: Русский
          build: true
          nav_translations:
            Home: Главная
            Secure Boot: Безопасная загрузка
            Third-Party Repositories: Сторонние репозитории
            NVIDIA Drivers: Драйверы NVIDIA
            Multimedia and Codecs: Мультимедиа и кодеки
            Tooling: Инструменты
        - locale: id
          name: Bahasa Indonesia
          build: true
          nav_translations:
            Home: Beranda
            Secure Boot: Secure Boot
            Third-Party Repositories: Repositori Pihak Ketiga
            NVIDIA Drivers: Driver NVIDIA
            Multimedia and Codecs: Multimedia dan Kodek
            Tooling: Perkakas

  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true

hooks:
  - ci/hooks/redirects.py

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences

extra:
  brand: fedora.help

extra_css:
  - stylesheets/extra.css
