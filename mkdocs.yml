site_name: fedora.help
site_url: https://fedora.help
site_dir: build
repo_url: https://github.com/akdev1l/fedora.help
repo_name: akdev1l/fedora.help
edit_uri: edit/main/docs/
copyright: >-
  Content licensed
  <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>
theme:
  name: material
  features:
    - navigation.indexes
    - content.action.edit
    - content.action.view

nav:
  - Home: index.md
  - Secure Boot: secure-boot.md
  - Third-Party Repositories: repositories.md
  - NVIDIA Drivers:
      - nvidia/index.md
      - The negativo17 Route: nvidia/negativo17.md
  - Multimedia and Codecs: multimedia.md
  - Tooling:
      - tooling/index.md
      - Fedora Tricks: tooling/fedoratricks.md

plugins:
  - search
  - macros
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Secure Boot: Arranque Seguro
            Third-Party Repositories: Repositorios de Terceros
            NVIDIA Drivers: Controladores NVIDIA
            The negativo17 Route: La vía negativo17
            Multimedia and Codecs: Multimedia y Códecs
            Tooling: Herramientas
            Fedora Tricks: Fedora Tricks
        - locale: pt
          name: Português
          build: true
          nav_translations:
            Home: Início
            Secure Boot: Inicialização Segura
            Third-Party Repositories: Repositórios de Terceiros
            NVIDIA Drivers: Drivers NVIDIA
            The negativo17 Route: A via negativo17
            Multimedia and Codecs: Multimídia e Codecs
            Tooling: Ferramentas
            Fedora Tricks: Fedora Tricks
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Secure Boot: Démarrage sécurisé
            Third-Party Repositories: Dépôts tiers
            NVIDIA Drivers: Pilotes NVIDIA
            The negativo17 Route: La voie negativo17
            Multimedia and Codecs: Multimédia et codecs
            Tooling: Outils
            Fedora Tricks: Fedora Tricks
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Secure Boot: 安全启动
            Third-Party Repositories: 第三方仓库
            NVIDIA Drivers: NVIDIA 驱动
            The negativo17 Route: negativo17 方案
            Multimedia and Codecs: 多媒体与编解码器
            Tooling: 工具
            Fedora Tricks: Fedora Tricks
        - locale: ru
          name: Русский
          build: true
          nav_translations:
            Home: Главная
            Secure Boot: Безопасная загрузка
            Third-Party Repositories: Сторонние репозитории
            NVIDIA Drivers: Драйверы NVIDIA
            The negativo17 Route: Вариант negativo17
            Multimedia and Codecs: Мультимедиа и кодеки
            Tooling: Инструменты
            Fedora Tricks: Fedora Tricks

  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true

hooks:
  - ci/hooks/redirects.py

markdown_extensions:
  - attr_list
  - md_in_html

extra:
  brand: fedora.help

extra_css:
  - stylesheets/extra.css
